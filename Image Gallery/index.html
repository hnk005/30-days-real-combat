<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <title>Image Gallery</title>
</head>

<body>
  <main>
    <div class="wrapper">
      <div class="gallery__container">
        <div class="gallery__image">
          <img src="./assets/image_1.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_2.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_3.png" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_4.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_5.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_6.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_7.jpg" alt="">
        </div>
        <div class="gallery__image">
          <img src="./assets/image_8.jpg" alt="">
        </div>
      </div>
    </div>
    <div class="lightbox hidden">
      <div class="lightbox__backdrop"></div>
      <div class="lightbox__close-btn">
        <i class='bx bx-x'></i>
      </div>
      <div class="lightbox__image">
        <img src="" alt="">
      </div>
      <div class="lightbox__control prev">
        <i class='bx bxs-chevron-left'></i>
      </div>
      <div class="lightbox__control after">
        <i class='bx bxs-chevron-right'></i>
      </div>
    </div>
  </main>
</body>
<script src="main.js"></script>

</html>
